<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Tadas Kaziunas, junior developer with a cybersecurity background. Portfolio: tadas380.github.io" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#b9f5dc"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".08" cy=".1" r=".6">
      <stop offset="0" stop-color="#3ddc97" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".9" cy="0" r=".55">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
      .line { opacity: 0; animation: show .01s forwards; }
      .l1 { animation-delay: .4s; } .l2 { animation-delay: 1.1s; } .l3 { animation-delay: 1.8s; }
      .l4 { animation-delay: 2.5s; } .l5 { animation-delay: 3.2s; } .l6 { animation-delay: 3.9s; }
      @keyframes show { to { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .dot { animation: pulse 2s ease-out infinite; transform-origin: 70px 78px; }
      @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 70% { opacity: 0; transform: scale(2.6); } 100% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0a0d10"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
    <rect y="314" width="1200" height="6" fill="url(#bar)"/>
  </g>

  <!-- Left: name and title -->
  <rect x="56" y="64" width="300" height="28" rx="14" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".3"/>
  <circle class="dot" cx="70" cy="78" r="4" fill="#3ddc97"/>
  <circle cx="70" cy="78" r="4" fill="#3ddc97"/>
  <text x="84" y="83" class="mono" font-size="14" fill="#3ddc97">Open to junior developer roles</text>

  <text x="54" y="160" class="sans" font-size="60" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Tadas Kaziunas</text>
  <text x="56" y="200" class="mono" font-size="19" fill="#4cc9f0">Junior developer · cybersecurity background</text>
  <text x="56" y="236" class="sans" font-size="17" fill="#8b98a5">Web apps, APIs and security tools · Kaunas, Lithuania</text>
  <text x="56" y="276" class="mono" font-size="16" fill="#e6edf3"><tspan fill="#3ddc97">↗ </tspan>tadas380.github.io</text>

  <!-- Right: terminal -->
  <g transform="translate(700 44)">
    <rect width="446" height="232" rx="14" fill="#0d1217" stroke="#2c3a48"/>
    <line x1="0" y1="38" x2="446" y2="38" stroke="#1f2a35"/>
    <circle cx="20" cy="19" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="19" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="19" r="5.5" fill="#28c840"/>
    <text x="430" y="24" text-anchor="end" class="mono" font-size="12" fill="#8b98a5">bash — kaunas</text>

    <g class="mono" font-size="14">
      <text x="20" y="70" class="line l1"><tspan fill="#3ddc97">➜ </tspan><tspan fill="#4cc9f0">~ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
      <text x="20" y="94" class="line l2" fill="#e6edf3"><tspan fill="#4cc9f0">tadas</tspan> · junior developer · kaunas, lt</text>
      <text x="20" y="122" class="line l3"><tspan fill="#3ddc97">➜ </tspan><tspan fill="#4cc9f0">~ </tspan><tspan fill="#e6edf3">./security-checker example.lt</tspan></text>
      <text x="20" y="146" class="line l4" fill="#e6edf3"><tspan fill="#8b98a5">[grade]</tspan> B · <tspan fill="#ffb454">2 things to fix first</tspan></text>
      <text x="20" y="174" class="line l5"><tspan fill="#3ddc97">➜ </tspan><tspan fill="#4cc9f0">~ </tspan><tspan fill="#e6edf3">echo $STATUS</tspan></text>
      <text x="20" y="198" class="line l6" fill="#3ddc97">open to work<tspan class="cursor" fill="#3ddc97"> █</tspan></text>
    </g>
  </g>
</svg>
